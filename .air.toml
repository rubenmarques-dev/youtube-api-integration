root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  pre_cmd = ["swag init -g cmd/server/main.go --output docs"]
  cmd = "go build -o ./tmp/main ./cmd/server"
  bin = "./tmp/main"
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["tmp", "vendor", "testdata", "docs"]
  exclude_regex = ["_test.go"]
  delay = 1000

[log]
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
